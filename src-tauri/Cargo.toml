[package]
name = "image-to-ascii-3d"
version = "26.7.11"
description = "Color image-to-ASCII converter with optional 3D parallax"
authors = ["ImageToASCII3D contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "image_to_ascii_3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = [] }
